name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript SDK and Next.js Web App
        run: npm run build

      - name: Run Core Fintech Verification Test Suite
        run: npm run test:razoragent

      - name: Run Direct MCP JSON-RPC 2.0 Protocol Tests
        run: npm run test:mcp
